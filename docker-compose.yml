name: dataengine

services:
  postgres-primary:
    image: postgis/postgis:18-3.6-alpine
    container_name: dataengine-primary
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:-0.0.0.0}:${PG_PRIMARY_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      PGDATA: ${PGDATA}
    volumes:
      - ${POSTGRES_PRIMARY_DATA}:/var/lib/postgresql/data
      - ./postgres/certs:/var/lib/postgresql/certs
      - ./postgres/primary/entrypoint.sh:/entrypoint-ssl.sh:ro
      - ./postgres/primary/init:/docker-entrypoint-initdb.d
      - ./postgres/primary/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./restore:/restore
      - ./scripts:/scripts:ro
    entrypoint: /entrypoint-ssl.sh
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  pg-backup:
    build: ./backup
    container_name: dataengine-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AO_ENDPOINT: ${AO_ENDPOINT}
      AO_BUCKET: ${AO_BUCKET}
      AO_ACCESS_KEY: ${AO_ACCESS_KEY}
      AO_SECRET_KEY: ${AO_SECRET_KEY}
    volumes:
      - ${BACKUP_DATA}:/backups
      - ./postgres/certs:/certs:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - db-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: dataengine-pgbouncer
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - db-network

  jobs:
    build: ./jobs
    container_name: dataengine-jobs
    restart: unless-stopped
    environment:
      DATAENGINE_DB_USER: ${POSTGRES_USER}
      DATAENGINE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATAENGINE_DB_HOST: postgres-primary
      DATAENGINE_DB_PORT: "5432"
      DATAENGINE_DB_NAME: ${POSTGRES_DB}
      DATAENGINE_DB_SSLMODE: require
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - db-network

  version-api:
    image: nginx:alpine
    container_name: dataengine-version-api
    restart: unless-stopped
    ports:
      - "${VERSION_API_PORT:-8088}:80"
    volumes:
      - ./version-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./version-api/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/ontoy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - db-network

networks:
  db-network:
    name: dataengine-network
    driver: bridge

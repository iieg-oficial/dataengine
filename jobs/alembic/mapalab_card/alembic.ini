# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic/mapalab_card

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Use os.pathsep.
version_path_separator = os

sqlalchemy.url = postgresql+psycopg2://${MAPALAB_CARD_DB_USER}:${MAPALAB_CARD_DB_PASSWORD}@${MAPALAB_CARD_DB_HOST}:${MAPALAB_CARD_DB_PORT}/${MAPALAB_CARD_DB_NAME}


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

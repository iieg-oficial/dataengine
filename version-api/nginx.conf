server {
    listen 80;
    server_name _;

    location = /ontoy {
        default_type application/json;
        alias /usr/share/nginx/html/version.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not found","endpoints":["/ontoy"]}';
    }
}

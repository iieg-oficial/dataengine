name: dataengine

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:?}

x-postgres-env-file: &postgres-env-file
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD_FILE: /run/secrets/dataengine_postgres_password
  POSTGRES_DB: ${POSTGRES_DB:?}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres-primary:
    image: postgis/postgis:18-3.6-alpine
    container_name: dataengine-primary
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:?}:${PG_PRIMARY_PORT:?}:5432"
    environment:
      <<: *postgres-env-file
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      PGDATA: ${PGDATA:?}
    secrets:
      - dataengine_postgres_password
    volumes:
      - ${POSTGRES_PRIMARY_DATA:?}:/var/lib/postgresql/data
      - ./postgres/certs:/var/lib/postgresql/certs
      - ./postgres/primary/entrypoint.sh:/entrypoint-ssl.sh:ro
      - ./postgres/primary/init:/docker-entrypoint-initdb.d
      - ./postgres/primary/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./restore:/restore
      - ./scripts:/scripts:ro
    entrypoint: /entrypoint-ssl.sh
    command: ["postgres",
              "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?}",
              "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:?}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:?}"]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
    networks:
      - db-network
    logging: *logging

  pg-backup:
    build: ./backup
    container_name: dataengine-backup
    restart: unless-stopped
    environment:
      <<: *postgres-env
      AO_ENDPOINT: ${AO_ENDPOINT:?}
      AO_BUCKET: ${AO_BUCKET:?}
      AO_ACCESS_KEY: ${AO_ACCESS_KEY:?}
      AO_SECRET_KEY: ${AO_SECRET_KEY:?}
      BACKUP_UID: ${BACKUP_UID:?}
      BACKUP_GID: ${BACKUP_GID:?}
    volumes:
      - ${BACKUP_DATA:?}:/backups
      - ./postgres/certs:/certs:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pgrep -x crond > /dev/null || exit 1"]
      interval: 60s
      retries: 3
    extra_hosts: *host-gateway
    networks:
      - db-network
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: dataengine-pgbouncer
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:?}:${PGBOUNCER_PORT:?}:6432"
    environment: *postgres-env
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:?}"]
      retries: 3
    networks:
      - db-network
    logging: *logging

  jobs:
    build: ./jobs
    container_name: dataengine-jobs
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:?}:${VERSION_API_PORT:?}:8088"
    volumes:
      - ./VERSION:/app/VERSION:ro
    environment:
      DATAENGINE_DB_USER: ${POSTGRES_USER:?}
      DATAENGINE_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DATAENGINE_DB_HOST: postgres-primary
      DATAENGINE_DB_PORT: "5432"
      DATAENGINE_DB_NAME: ${POSTGRES_DB:?}
      DATAENGINE_DB_SSLMODE: require
      AO_ENDPOINT: ${AO_ENDPOINT:?}
      MAPALAB_AO_BUCKET: ${MAPALAB_AO_BUCKET:?}
      MAPALAB_AO_ACCESS_KEY: ${MAPALAB_AO_ACCESS_KEY:?}
      MAPALAB_AO_SECRET_KEY: ${MAPALAB_AO_SECRET_KEY:?}
      ONTOY_SERVICE: dataengine
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
      interval: 30s
      retries: 3
    extra_hosts: *host-gateway
    networks:
      - db-network
    logging: *logging

networks:
  db-network:
    name: dataengine-network
    driver: bridge

secrets:
  dataengine_postgres_password:
    file: ./secrets/dataengine_postgres_password

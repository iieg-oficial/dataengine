name: dataengine

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

x-postgres-env-file: &postgres-env-file
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD_FILE: /run/secrets/dataengine_postgres_password
  POSTGRES_DB: ${POSTGRES_DB:?}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres-primary:
    image: postgis/postgis:18-3.6-alpine
    container_name: dataengine-primary
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:?}:${PG_PRIMARY_PORT:?}:5432"
    environment:
      <<: *postgres-env-file
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      DB_NETWORK_SUBNET: ${DATAENGINE_NETWORK_SUBNET:?}
      PGDATA: ${PGDATA:?}
    secrets:
      - dataengine_postgres_password
    volumes:
      - ${POSTGRES_PRIMARY_DATA:?}:/var/lib/postgresql/data
      - ./postgres/certs:/var/lib/postgresql/certs
      - ./postgres/primary/entrypoint.sh:/entrypoint-ssl.sh:ro
      - ./postgres/primary/init:/docker-entrypoint-initdb.d
      - ./postgres/primary/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./restore:/restore
      - ./scripts:/scripts:ro
    entrypoint: /entrypoint-ssl.sh
    command: ["postgres",
              "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?}",
              "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:?}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:?}"]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
    networks:
      - db-network
    logging: *logging

  pg-backup:
    build: ./backup
    container_name: dataengine-backup
    restart: unless-stopped
    environment:
      <<: *postgres-env-file
      AO_ENDPOINT: ${AO_ENDPOINT:?}
      AO_BUCKET: ${AO_BUCKET:?}
      AO_ACCESS_KEY: ${AO_ACCESS_KEY:?}
      AO_SECRET_KEY: ${AO_SECRET_KEY:?}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      BACKUP_UID: ${BACKUP_UID:?}
      BACKUP_GID: ${BACKUP_GID:?}
    secrets:
      - dataengine_postgres_password
    volumes:
      - ${BACKUP_DATA:?}:/backups
      - ./postgres/certs:/certs:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pgrep -x crond > /dev/null || exit 1"]
      interval: 60s
      retries: 3
    extra_hosts: *host-gateway
    networks:
      - db-network
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: dataengine-pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:?}:6432"
    environment: *postgres-env-file
    secrets:
      - dataengine_postgres_password
      - dataengine_pgbouncer_admin_password
    group_add:
      - "${DATAENGINE_SECRETS_GID:?}"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:?}"]
      retries: 3
    networks:
      - db-network
    logging: *logging

  jobs:
    build: ./jobs
    container_name: dataengine-jobs
    restart: unless-stopped
    environment:
      DATAENGINE_DB_USER: ${POSTGRES_USER:?}
      DATAENGINE_DB_PASSWORD_FILE: /run/secrets/dataengine_postgres_password
      DATAENGINE_DB_HOST: postgres-primary
      DATAENGINE_DB_PORT: "5432"
      DATAENGINE_DB_NAME: ${POSTGRES_DB:?}
      DATAENGINE_DB_SSLMODE: require
      AO_ENDPOINT: ${AO_ENDPOINT:?}
      MAPALAB_AO_BUCKET: ${MAPALAB_AO_BUCKET:?}
      MAPALAB_AO_ACCESS_KEY_FILE: /run/secrets/dataengine_mapalab_ao_access_key
      MAPALAB_AO_SECRET_KEY_FILE: /run/secrets/dataengine_mapalab_ao_secret_key
      GEOSERVER_URL: ${GEOSERVER_URL:?}
    secrets:
      - dataengine_postgres_password
      - dataengine_mapalab_ao_access_key
      - dataengine_mapalab_ao_secret_key
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-s", "/var/run/crond.pid"]
      interval: 30s
      retries: 3
    extra_hosts: *host-gateway
    networks:
      - db-network
    logging: *logging

  docker-socket-proxy:
    image: nginx:1.30.4-alpine
    container_name: dataengine-docker-socket-proxy
    restart: unless-stopped
    user: "101:101"
    group_add:
      - ${DOCKER_GID:?}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./version-api/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging: *logging

  version-api:
    build: ./version-api
    container_name: dataengine-version-api
    restart: unless-stopped
    ports:
      - "${PG_BIND_ADDRESS:?}:${VERSION_API_PORT:?}:8088"
    environment:
      ONTOY_SERVICE: dataengine
      ONTOY_COMPOSE_PROJECT: dataengine
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS?}
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./VERSION:/app/VERSION:ro
      - ./docs/CHANGELOG.md:/app/CHANGELOG.md:ro
      - /etc/os-release:/host/etc/os-release:ro
    depends_on:
      - docker-socket-proxy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
      interval: 30s
      retries: 3
    extra_hosts: *host-gateway
    networks:
      - ontoy-network
      - docker-api
    logging: *logging

networks:
  db-network:
    name: dataengine-network
    driver: bridge
    ipam:
      config:
        - subnet: ${DATAENGINE_NETWORK_SUBNET:?}
  ontoy-network:
    name: dataengine-ontoy-network
    driver: bridge
    ipam:
      config:
        - subnet: ${DATAENGINE_ONTOY_SUBNET:?}
  docker-api:
    name: dataengine-docker-api
    internal: true
    ipam:
      config:
        - subnet: ${DATAENGINE_DOCKER_API_SUBNET:?}

secrets:
  dataengine_postgres_password:
    file: ./secrets/dataengine_postgres_password
  dataengine_pgbouncer_admin_password:
    file: ./secrets/dataengine_pgbouncer_admin_password
  dataengine_mapalab_ao_access_key:
    file: ./secrets/dataengine_mapalab_ao_access_key
  dataengine_mapalab_ao_secret_key:
    file: ./secrets/dataengine_mapalab_ao_secret_key
